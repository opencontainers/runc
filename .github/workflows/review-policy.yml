# Enforce the pull request merge rules described in MAINTAINERS_GUIDE.md
# ("Who decides what?"). This job is a required status check.
#
# It only runs when a review is submitted, edited, or dismissed, and evaluates
# the current state of the pull request. Other events (pull_request) are not
# used on purpose: branch protection requires the latest run for each event
# type to pass, so a failed pull_request run (say, "needs an LGTM") would keep
# blocking the merge after a review fixes it. This means:
#
#  - after new commits are pushed, the check is missing (so the pull request
#    can't be merged) until a review is submitted (a comment-only review by
#    anyone, including the author, is fine);
#  - if the check fails because of a review period, re-run it once the
#    period is over.
#
# It also runs for merge_group, as all required checks must pass in the merge
# queue. There it does nothing, since a pull request can only be added to the
# queue once this check has passed for it.
#
# As with any pull_request_review workflow, this file is run from the pull
# request, so a pull request can change it. Therefore it is a governance file
# (see isGovernanceFile below), and changes to it must be reviewed carefully.
# Also, keep it read-only: do NOT add write permissions, secrets, or
# actions/checkout.
#
# Other repositories can use this workflow via workflow_call, by having a
# .github/workflows/review-policy.yml file like this:
#
#   name: review-policy
#   on:
#     pull_request_review:
#       types: [submitted, edited, dismissed]
#   permissions: {}
#   jobs:
#     review-policy:
#       permissions:
#         contents: read
#         pull-requests: read
#       uses: opencontainers/runc/.github/workflows/review-policy.yml@<sha>
#
# Always pin it to a commit SHA, so the rules can only be changed by a
# governance change in the calling repository. The rules are the same as
# here; the calling repository must document them in its MAINTAINERS_GUIDE.md.
# Note the required status check name is then "review-policy / review-policy".
name: review-policy
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
  workflow_call:

permissions: {}

jobs:
  review-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: github.event_name == 'pull_request_review'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            // Review period for maintainer's pull requests with one LGTM.
            const days = 7;
            const largeDays = 14;
            const largeLines = 100;

            // MAINTAINERS lines look like "Name <email> (@login)". Always read
            // it from the default branch, even for pull requests against
            // release branches: this is the single source of truth.
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: 'MAINTAINERS', ref: defaultBranch,
            });
            const maintainers = new Set(
              Buffer.from(file.content, 'base64').toString()
                .split('\n')
                .map((line) => line.trim().split(' ').pop())
                .filter((word) => word.startsWith('(@') && word.endsWith(')'))
                .map((word) => word.slice(2, -1).toLowerCase()));
            if (maintainers.size === 0) {
              core.setFailed('No maintainers found in MAINTAINERS.');
              return;
            }
            core.info(`Maintainers: ${[...maintainers].join(' ')}`);

            // Use the current state rather than the event payload, which is stale
            // when the job is re-run.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number,
            });

            // When the pull request was (last) marked as ready for review.
            // A pull request opened as non-draft has no such event.
            async function readySince(pr) {
              // This returns all events (from all pages), oldest first.
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const ready = events.filter((e) => e.event === 'ready_for_review').pop();
              return new Date(ready ? ready.created_at : pr.created_at);
            }

            // Files defining the project rules, or enforcing them.
            function isGovernanceFile(f) {
              return f === 'MAINTAINERS' || f === 'CODEOWNERS' ||
                (f.endsWith('.md') && !f.includes('/') &&
                  f !== 'README.md' && f !== 'CHANGELOG.md') ||
                f.startsWith('.github/workflows/review-policy');
            }

            // Documentation and CI configuration.
            function isRoutineFile(f) {
              return f.endsWith('.md') || f.startsWith('.github/');
            }

            // Returns 'governance', 'routine', or 'normal'.
            function changeKind(pr, files) {
              // The API returns at most 3000 files, so a governance file
              // might be missing from the list.
              if (files.length >= 3000) {
                return 'governance';
              }
              const names = files.flatMap((f) =>
                f.previous_filename ? [f.filename, f.previous_filename] : [f.filename]);
              if (names.some(isGovernanceFile)) {
                return 'governance';
              }
              if (pr.user.login === 'dependabot[bot]' || names.every(isRoutineFile)) {
                return 'routine';
              }
              return 'normal';
            }

            async function evaluate(pr) {
              if (pr.draft) {
                return ['pending', 'Draft pull request.'];
              }
              const author = pr.user.login.toLowerCase();
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              // The latest non-comment review of each reviewer is what counts.
              const latest = new Map();
              for (const r of reviews) {
                if (r.user && r.state !== 'COMMENTED' && r.state !== 'PENDING') {
                  latest.set(r.user.login.toLowerCase(), r.state);
                }
              }
              const approved = [];
              const blocked = [];
              for (const [user, state] of latest) {
                if (user === author || !maintainers.has(user)) {
                  continue;
                }
                if (state === 'APPROVED') {
                  approved.push(user);
                } else if (state === 'CHANGES_REQUESTED') {
                  blocked.push(user);
                }
              }

              if (blocked.length > 0) {
                return ['failure', `Changes requested by ${blocked.join(', ')}.`];
              }
              if (approved.length >= 2) {
                return ['success', `LGTMs from ${approved.join(', ')}.`];
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              const kind = changeKind(pr, files);
              if (kind === 'routine') {
                if (approved.length === 1) {
                  return ['success', `LGTM from ${approved[0]} (routine change).`];
                }
                return ['pending', 'Needs 1 maintainer LGTM (routine change).'];
              }
              if (kind === 'governance') {
                return ['pending', `Needs 2 maintainer LGTMs (governance change), got ${approved.length}.`];
              }
              if (approved.length === 0 || !maintainers.has(author)) {
                return ['pending', `Needs 2 maintainer LGTMs, got ${approved.length}.`];
              }
              const lines = files
                .filter((f) => !f.filename.startsWith('vendor/'))
                .reduce((sum, f) => sum + f.additions + f.deletions, 0);
              const period = lines > largeLines ? largeDays : days;
              const until = new Date((await readySince(pr)).getTime() + period * 86400 * 1000);
              if (Date.now() >= until.getTime()) {
                return ['success', `LGTM from ${approved[0]}, and ${period} days passed.`];
              }
              const date = until.toISOString().slice(0, 16).replace('T', ' ');
              return ['pending', `Needs another LGTM, or re-run this check after ${date} UTC.`];
            }

            // Check runs belong to a commit, not to a pull request, so pull
            // requests having the same head commit can't be told apart.
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const shared = open
              .filter((p) => p.head.sha === pr.head.sha)
              .map((p) => `#${p.number}`);
            const [state, description] = shared.length > 1
              ? ['failure', `Same head commit in ${shared.join(', ')}; push a different commit to all but one.`]
              : await evaluate(pr);
            core.info(`#${pr.number} (${pr.head.sha}): ${state}: ${description}`);
            await core.summary
              .addRaw(`${description} See [the rules](${context.serverUrl}/${owner}/${repo}/blob/${defaultBranch}/MAINTAINERS_GUIDE.md#who-decides-what).`)
              .write();
            if (state !== 'success') {
              core.setFailed(description);
            }
