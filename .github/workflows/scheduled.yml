# This enables periodical execution of CI jobs in branches we maintain.
#
# CI jobs are triggered through here (instead of adding "schedule:" to the
# appropriate files) because scheduled jobs are only run on the main branch.
# In other words, it's a way to run periodical CI for other branches.

name: scheduled
on:
  schedule:
    # Runs at 00:00 UTC every Sunday, Tuesday, Thursday.
    - cron: '0 0 * * 0,2,4'
  workflow_dispatch:
permissions:
  contents: read
  actions: write

jobs:
  # Figure out which branches to run CI on. This is the main branch, plus the
  # three most recent release-X.Y branches (as per the support policy in
  # RELEASES.md, we maintain latest, latest-1, and latest-2).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.branches.outputs.result }}
    steps:
      - name: Find branches to test
        id: branches
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const re = /^release-(\d+)\.(\d+)$/;
            const all = await github.paginate(github.rest.repos.listBranches, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const rel = all
              .map((b) => b.name.match(re))
              .filter((m) => m !== null)
              .sort((a, b) => b[1] - a[1] || b[2] - a[2])
              .slice(0, 3)
              .map((m) => m[0]);
            if (rel.length === 0) {
              core.setFailed('No release-X.Y branches found.');
            }
            const branches = ['main', ...rel];
            core.info(`Branches to test: ${branches.join(' ')}`);
            return JSON.stringify(branches);

  trigger-workflow:
    needs: prepare
    strategy:
      matrix:
        branch: ${{ fromJSON(needs.prepare.outputs.branches) }}
        wf_id: ["validate.yml", "test.yml"]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ${{ matrix.wf_id }} workflow on ${{ matrix.branch}} branch
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ matrix.wf_id }}',
              ref: '${{ matrix.branch }}'
            });
