# This enables periodical execution of CI jobs in branches we maintain.
#
# CI jobs are triggered through here (instead of adding "schedule:" to the
# appropriate files) because scheduled jobs are only run on the main branch.
# In other words, it's a way to run periodical CI for other branches.

name: scheduled
on:
  schedule:
    # Runs at 00:00 UTC every Sunday, Tuesday, Thursday.
    - cron: '0 0 * * 0,2,4'
  workflow_dispatch:

# There is no point in triggering the downstream workflows twice. Note this
# does not cancel a run that is already in progress: doing so could leave part
# of the matrix (i.e. some of the branches) without a trigger.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-workflow:
    permissions:
      contents: read
      actions: write # Needed to trigger other workflows.
    strategy:
      matrix:
        branch: ["main", "release-1.5", "release-1.4", "release-1.3"]
        wf_id: ["validate.yml", "test.yml"]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ${{ matrix.wf_id }} workflow on ${{ matrix.branch}} branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '${{ matrix.wf_id }}',
              ref: '${{ matrix.branch }}'
            });
