# NOTE Github Actions execution environments lack a terminal, needed for
# some integration tests. So we use `script` command to fake a terminal.

name: ci
on:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*
  merge_group:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same pull request. For everything else
# (in particular, pushes to a branch or a tag) there is no PR number, so
# the group falls back to the unique run_id and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIBPATHRS_VERSION: "0.2.6"
  # Don't ignore C warnings. Note that the output of "go env CGO_CFLAGS" by default is "-g -O2", so we keep them.
  CGO_CFLAGS: -g -O2 -Werror
  # Allow potentially unsafe tests.
  RUNC_ALLOW_UNSAFE_TESTS: yes

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
        go-version: [1.26.x, 1.27.x]
        libpathrs: ["libpathrs", ""]
        rootless: ["rootless", ""]
        race: ["-race", ""]
        criu: ["", "criu-dev"]
        exclude:
          # Disable most of criu-dev jobs, as they are expensive
          # (need to compile criu) and don't add much value/coverage.
          - criu: criu-dev
            go-version: 1.26.x
          - criu: criu-dev
            rootless: rootless
          # Do race detection only with latest stable Go version.
          - race: -race
            go-version: 1.26.x

    runs-on: ${{ matrix.os }}

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Show host info
      run: |
        set -x
        # Sync `set -x` outputs with command ouputs
        exec 2>&1
        # Version
        uname -a
        cat /etc/os-release
        # Hardware
        cat /proc/cpuinfo
        free -mt
        # cgroup
        ls -F /sys/fs/cgroup
        cat /proc/self/cgroup
        if [ -e /sys/fs/cgroup/cgroup.controllers ]; then
          cat /sys/fs/cgroup/cgroup.controllers
          cat /sys/fs/cgroup/cgroup.subtree_control
          ls -F /sys/fs/cgroup"$(grep -oP '0::\K.*' /proc/self/cgroup)"
        fi
        # kernel config
        script/check-config.sh

    - name: install deps
      run: |
        sudo apt update
        sudo apt -y install libseccomp-dev sshfs uidmap lld

    - name: use the original sudo
      # Ubuntu 26.04 uses sudo-rs by default, which does not support -E
      # (https://github.com/trifectatechfoundation/sudo-rs/issues/1299).
      if: startsWith(matrix.os, 'ubuntu-26.04')
      run: |
        sudo apt -y install sudo
        sudo update-alternatives --set sudo /usr/bin/sudo.ws

    - name: install libpathrs ${{ env.LIBPATHRS_VERSION }}
      if: ${{ matrix.libpathrs != '' }}
      run: |
        sudo -E PATH="$PATH" ./script/build-libpathrs.sh "$LIBPATHRS_VERSION" /usr

    - name: remove libpathrs build tag
      if: ${{ matrix.libpathrs == '' }}
      run: |
        echo RUNC_BUILDTAGS=-libpathrs >>"$GITHUB_ENV"

    - name: install CRIU
      if: ${{ matrix.criu == '' }}
      env:
        PREFIX: https://download.opensuse.org/repositories/devel:/tools:/criu/xUbuntu
      run: |
        REPO=${PREFIX}_$(. /etc/os-release && echo $VERSION_ID)
        curl -fSsLl "$REPO/Release.key" | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/devel_tools_criu.gpg > /dev/null
        echo "deb $REPO/ /" | sudo tee /etc/apt/sources.list.d/criu.list
        sudo apt update
        # Ubuntu 26.04 comes with criu preinstalled, split into a few
        # packages (criu, libcompel1, python3-pycriu) which conflict with
        # the monolithic criu package from the repo above, so remove all
        # the packages built from the distro criu source first.
        distro_criu=$(dpkg-query -W -f='${binary:Package} ${source:Package}\n' | awk '$2 == "criu" { print $1 }')
        if [ -n "$distro_criu" ]; then
          # shellcheck disable=SC2086 # Word splitting is intentional here.
          sudo apt -y purge $distro_criu
        fi
        sudo apt -y install criu

    - name: install CRIU (${{ matrix.criu }})
      if: ${{ matrix.criu != '' }}
      run: |
        sudo apt -qy install \
          libcap-dev libnet1-dev libnl-3-dev uuid-dev \
          libprotobuf-c-dev libprotobuf-dev protobuf-c-compiler protobuf-compiler
        git clone --depth 1 --branch ${{ matrix.criu }} --single-branch \
          https://github.com/checkpoint-restore/criu.git ~/criu
        (cd ~/criu && sudo make -j "$(nproc)" install-criu)
        rm -rf ~/criu
        criu --version

    - name: install go ${{ matrix.go-version }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true

    - name: build
      run: sudo -E PATH="$PATH" make EXTRA_FLAGS="${{ matrix.race }}" all

    - name: Setup Bats and bats libs
      uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
      with:
        bats-version: 1.12.0 # Known as BATS_VERSION in other places.
        support-install: false
        assert-install: false
        detik-install: false
        file-install: false

    - name: Allow userns for runc
      # https://discourse.ubuntu.com/t/ubuntu-24-04-lts-noble-numbat-release-notes/39890#unprivileged-user-namespace-restrictions-15
      run: |
        # The attachment path differs between Ubuntu versions (/usr/sbin/runc
        # on 24.04, /usr/{bin,sbin}/runc on 26.04), so match it loosely.
        sed -E "s;^profile runc [^ ]+ ;profile runc-test $PWD/runc ;" < /etc/apparmor.d/runc | sudo apparmor_parser

    - name: unit test
      if: matrix.rootless != 'rootless'
      run: sudo -E PATH="$PATH" -- make TESTFLAGS="${{ matrix.race }}" localunittest

    - name: add rootless user
      if: matrix.rootless == 'rootless'
      run: |
        ./script/setup_rootless.sh
        sudo chmod a+X "$HOME" # for Ubuntu 22.04 and later

    - name: integration test (fs driver)
      continue-on-error: ${{ matrix.criu != '' }} # Don't let criu-dev errors fail CI.
      run: sudo -E PATH="$PATH" script -e -c 'make local${{ matrix.rootless }}integration'

    - name: integration test (systemd driver)
      continue-on-error: ${{ matrix.criu != '' }} # Don't let criu-dev errors fail CI.
      run: |
        # Delegate all cgroup v2 controllers to rootless user via --systemd-cgroup.
        # The default (since systemd v252) is "pids memory cpu".
        sudo mkdir -p /etc/systemd/system/user@.service.d
        printf "[Service]\nDelegate=yes\n" | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
        sudo systemctl daemon-reload
        # Run the tests.
        sudo -E PATH="$PATH" script -e -c 'make RUNC_USE_SYSTEMD=yes local${{ matrix.rootless }}integration'

  # We need to continue support for 32-bit ARM.
  # However, we do not have 32-bit ARM CI, so we use i386 for testing 32bit stuff.
  # We are not interested in providing official support for i386.
  cross-i386:
    timeout-minutes: 15
    strategy:
      fail-fast: false
    runs-on: ubuntu-24.04

    steps:

    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install deps
      run: |
        sudo dpkg --add-architecture i386
        # Add criu repo. The web server returns gateway timeout, thus the retry.
        sudo add-apt-repository -y ppa:criu/ppa || sudo add-apt-repository -y ppa:criu/ppa
        # apt-add-repository runs apt update so we don't have to.

        GCC_VERSION="$(gcc -dumpversion)"
        sudo apt -qy install \
          lld criu \
          libseccomp-dev libseccomp-dev:i386 \
          libc-dev:i386 libgcc-s1:i386 "libgcc-${GCC_VERSION}-dev:i386" gcc-i686-linux-gnu

        # When cross-compiling, GCC 13 and earlier will look for a linker that
        # is marked for cross-compilation, which the Ubuntu lld package doesn't
        # provide. The solution is to create a symlink ourselves. GCC 14 fixed
        # this, see <https://gcc.gnu.org/bugzilla/show_bug.cgi?id=111605>.
        ln -sv "$(which ld.lld)" /usr/local/bin/i686-linux-gnu-ld.lld
    - run: rustup target add i686-unknown-linux-gnu

    - name: install libpathrs ${{ env.LIBPATHRS_VERSION }}
      run: |
        sudo -E PATH="$PATH" ./script/build-libpathrs.sh "$LIBPATHRS_VERSION" /usr 386
        sudo ldconfig /usr/386/lib

    - name: install go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.x # Latest stable
        check-latest: true

    - name: unit test
      env:
        CC: i686-linux-gnu-gcc
        PKG_CONFIG_PATH: /usr/386/lib/pkgconfig
      run: sudo -E PATH="$PATH" -- make GOARCH=386 localunittest

  lima:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A failure in fedora-rawhide should not block merging PRs
        template: [almalinux-8, almalinux-9, centos-stream-10, fedora, experimental/fedora-rawhide]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: lima-vm/lima-actions/setup@55627e31b78637bf254a8b2a14da8ea7d12564e5 # v1.1.0
      id: lima-actions-setup

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/lima
        key: lima-${{ steps.lima-actions-setup.outputs.version }}-${{ matrix.template }}

    - name: "Start VM"
      # --plain is set to disable file sharing, port forwarding, built-in containerd, etc. for faster start up
      #
      # CPUs: min(4, host CPU cores)
      # RAM:  min(4 GiB, half of host memory)
      # Disk: 100 GiB
      run: limactl start --plain --name=default template:${{ matrix.template }}

    - name: "Initialize VM"
      run: |
        set -eux -o pipefail
        limactl cp -r . default:/tmp/runc
        lima sudo /tmp/runc/script/setup_host.sh

    - name: "Show guest info"
      run: |
        set -eux -o pipefail
        lima uname -a
        lima systemctl --version
        lima df -T
        lima cat /etc/os-release
        lima go version
        lima sestatus
        lima rpm -q container-selinux

    - name: "Check config"
      run: lima /tmp/runc/script/check-config.sh

    # NOTE the execution environment lacks a terminal, needed for
    # some integration tests. So we use `ssh -tt` command to fake a terminal.
    - name: "Run unit tests"
      run: ssh -tt lima-default sudo -i make -C /tmp/runc localunittest

    - name: "Run integration tests (systemd driver)"
      run: ssh -tt lima-default sudo -i make -C /tmp/runc localintegration RUNC_USE_SYSTEMD=yes

    - name: "Run integration tests (fs driver)"
      run: ssh -tt lima-default sudo -i make -C /tmp/runc localintegration

    - name: "Run integration tests (systemd driver, rootless)"
      # Needs cgroup v2
      if: ${{ matrix.template != 'almalinux-8' }}
      run: ssh -tt lima-default sudo -i make -C /tmp/runc localrootlessintegration RUNC_USE_SYSTEMD=yes

    - name: "Run integration tests (fs driver, rootless)"
      run: ssh -tt lima-default sudo -i make -C /tmp/runc localrootlessintegration

  podman:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, system, system-rootless]
    runs-on: ubuntu-26.04
    name: podman (${{ matrix.suite }})
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install deps
      # Ubuntu's podman package is only used to get its runtime dependencies
      # (conmon, netavark, containers-common etc.); podman itself is built
      # from source below. CRIU is needed for podman checkpoint/restore tests.
      run: |
        sudo apt update
        sudo apt -y install libseccomp-dev libassuan-dev libbtrfs-dev libgpgme-dev libsystemd-dev \
          podman conmon netavark aardvark-dns catatonit criu
        criu --version

    - name: use the original sudo
      # Ubuntu 26.04 uses sudo-rs by default, which does not support -E
      # (https://github.com/trifectatechfoundation/sudo-rs/issues/1299).
      run: |
        sudo apt -y install sudo
        sudo update-alternatives --set sudo /usr/bin/sudo.ws

    - name: install libpathrs ${{ env.LIBPATHRS_VERSION }}
      run: |
        sudo -E PATH="$PATH" ./script/build-libpathrs.sh "$LIBPATHRS_VERSION" /usr

    - name: install go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.x # Latest stable
        check-latest: true

    - name: build and install runc
      # Podman tests expect the runtime to be named "runc", and /usr/bin/runc
      # is the first location podman looks for it, so replace the one there.
      run: |
        make
        sudo install -m0755 runc /usr/bin/runc

    - name: setup podman test environment
      run: |
        # Remote API service interferes with some tests.
        sudo systemctl disable --now podman.socket
        # Used by podman run --rootfs tests.
        echo containers:200000:268435456 | sudo tee -a /etc/subuid /etc/subgid

    - name: checkout podman
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: podman-container-tools/podman
        path: podman
        ref: v5.8.8
        persist-credentials: false

    - name: build podman
      env:
        # Don't use -Werror (set globally for runc) for podman.
        CGO_CFLAGS: -g -O2
      run: make -C podman binaries

    - name: run podman e2e tests
      if: matrix.suite == 'e2e'
      run: sudo -E PATH="$PATH" ./tests/podman/run-tests.sh ./podman

    - name: setup bats
      if: matrix.suite != 'e2e'
      uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
      with:
        bats-version: 1.13.0
        support-install: false
        assert-install: false
        detik-install: false
        file-install: false

    - name: configure podman to use runc by default
      if: matrix.suite != 'e2e'
      run: |
        printf '[engine]\nruntime = "runc"\n' | sudo tee /etc/containers/containers.conf.d/50-runc.conf

    - name: run podman system tests
      if: matrix.suite == 'system'
      run: sudo -E PATH="$PATH" ./tests/podman/run-system-tests.sh ./podman

    - name: setup rootless
      if: matrix.suite == 'system-rootless'
      run: |
        # Our podman binary is not covered by any AppArmor profile,
        # so it is not allowed to create user namespaces otherwise.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        # Delegate all cgroup v2 controllers to rootless user.
        sudo mkdir -p /etc/systemd/system/user@.service.d
        printf "[Service]\nDelegate=yes\n" | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
        sudo systemctl daemon-reload
        sudo loginctl enable-linger "$USER"
        grep -q "^$USER:" /etc/subuid || echo "$USER:100000:65536" | sudo tee -a /etc/subuid
        grep -q "^$USER:" /etc/subgid || echo "$USER:100000:65536" | sudo tee -a /etc/subgid
        # Wait for the user session bus.
        timeout 30 sh -c "until [ -S /run/user/$(id -u)/bus ]; do sleep 1; done"

    - name: run podman system tests (rootless)
      if: matrix.suite == 'system-rootless'
      run: |
        XDG_RUNTIME_DIR=/run/user/$(id -u)
        export XDG_RUNTIME_DIR
        export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
        ./tests/podman/run-system-tests.sh ./podman

  all-done:
    needs:
    - test
    - cross-i386
    - lima
    - podman
    runs-on: ubuntu-24.04
    steps:
    - run: echo "All jobs completed"
